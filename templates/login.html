<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Divera → Shelly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .login-card { width: 100%; max-width: 380px; }
    .login-header { background: #c0392b; color: #fff; border-radius: 8px 8px 0 0; padding: 1.5rem; text-align: center; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <i class="bi bi-fire fs-2"></i>
      <h5 class="mb-0 mt-1 fw-bold">Divera → Shelly</h5>
    </div>
    <div class="card border-0 shadow" style="border-radius: 0 0 8px 8px;">
      <div class="card-body p-4">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} py-2 small">{{ msg }}</div>
          {% endfor %}
        {% endwith %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label fw-semibold">Benutzername</label>
            <input type="text" class="form-control" name="username" autofocus autocomplete="username">
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Passwort</label>
            <input type="password" class="form-control" name="password" autocomplete="current-password">
          </div>
          <button type="submit" class="btn btn-danger w-100 fw-bold">
            <i class="bi bi-box-arrow-in-right"></i> Anmelden
          </button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
