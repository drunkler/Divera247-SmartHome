<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Divera → Shelly</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body {
      background: #f4f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-wrap { width: 100%; max-width: 380px; padding: 1rem; }
    .login-card {
      border-radius: 16px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 32px rgba(0,0,0,.1);
      overflow: hidden;
      background: #fff;
    }
    .login-head {
      background: linear-gradient(135deg, #c0392b 0%, #962d22 100%);
      padding: 2rem 1.5rem 1.6rem;
      text-align: center;
      color: #fff;
    }
    .login-head .flame { font-size: 2.2rem; filter: drop-shadow(0 0 8px rgba(255,200,100,.5)); }
    .login-head h5 { font-weight: 700; margin: .5rem 0 0; font-size: 1.05rem; letter-spacing: .01em; }
    .login-head p  { font-size: .8rem; opacity: .75; margin: .25rem 0 0; }
    .login-body { padding: 1.6rem 1.5rem; }
    .form-label { font-size: .8rem; font-weight: 600; color: #374151; margin-bottom: .3rem; }
    .form-control {
      border-radius: 8px; border: 1.5px solid #e5e7eb;
      font-size: .875rem; padding: .55rem .75rem;
      transition: border-color .15s, box-shadow .15s;
    }
    .form-control:focus { border-color: #c0392b; box-shadow: 0 0 0 3px rgba(192,57,43,.12); }
    .btn-login {
      background: linear-gradient(135deg, #c0392b 0%, #a93226 100%);
      border: none; color: #fff; font-weight: 600; border-radius: 8px;
      padding: .6rem; font-size: .9rem; width: 100%;
      transition: opacity .15s, transform .1s;
    }
    .btn-login:hover { opacity: .92; transform: translateY(-1px); color: #fff; }
    .alert { border-radius: 8px; border: none; font-size: .83rem; padding: .6rem .9rem; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-head">
        <div class="flame">🔥</div>
        <h5>Divera → Shelly</h5>
        <p>Einsatzlicht-Steuerung</p>
      </div>
      <div class="login-body">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for cat, msg in messages %}
            <div class="alert alert-{{ cat }} mb-3">{{ msg }}</div>
          {% endfor %}
        {% endwith %}
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Benutzername</label>
            <input type="text" class="form-control" name="username" autofocus autocomplete="username">
          </div>
          <div class="mb-4">
            <label class="form-label">Passwort</label>
            <input type="password" class="form-control" name="password" autocomplete="current-password">
          </div>
          <button type="submit" class="btn-login"><i class="bi bi-box-arrow-in-right me-1"></i> Anmelden</button>
        </form>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
