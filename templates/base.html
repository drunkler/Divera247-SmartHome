<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divera → Smarthome</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --red:        #c0392b;
      --red-dark:   #962d22;
      --red-light:  #f9eae8;
      --surface:    #f4f5f7;
      --card-bg:    #ffffff;
      --border:     #e5e7eb;
      --text:       #111827;
      --muted:      #6b7280;
      --green:      #16a34a;
      --green-bg:   #f0fdf4;
      --shadow-sm:  0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.05);
      --shadow-md:  0 4px 12px rgba(0,0,0,.08);
      --radius:     12px;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--surface);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14.5px;
    }

    /* ── Navbar ── */
    .navbar {
      background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%) !important;
      padding: 0 1.5rem;
      height: 56px;
      box-shadow: 0 2px 8px rgba(192,57,43,.35);
    }
    .navbar-brand {
      color: #fff !important;
      font-weight: 700;
      font-size: 1rem;
      letter-spacing: .01em;
      display: flex;
      align-items: center;
      gap: .45rem;
    }
    .navbar-brand .flame {
      font-size: 1.2rem;
      filter: drop-shadow(0 0 4px rgba(255,200,100,.6));
    }
    .nav-link {
      color: rgba(255,255,255,.82) !important;
      font-size: .875rem;
      font-weight: 500;
      padding: .4rem .7rem !important;
      border-radius: 6px;
      transition: background .15s, color .15s;
    }
    .nav-link:hover { background: rgba(255,255,255,.14); color: #fff !important; }
    .nav-link.active { color: #fff !important; background: rgba(255,255,255,.18); }
    .nav-logout {
      color: rgba(255,255,255,.7) !important;
      padding: .4rem .5rem !important;
      border-radius: 6px;
    }
    .nav-logout:hover { background: rgba(255,255,255,.14); color: #fff !important; }

    /* ── Cards ── */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-sm);
    }
    .card-header {
      background: transparent;
      border-bottom: 1px solid var(--border);
      padding: .9rem 1.1rem;
      font-size: .875rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .card-body { padding: 1.1rem; }

    /* ── Status-Karten ── */
    .status-card {
      border-radius: var(--radius);
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      border: 1px solid var(--border);
      background: var(--card-bg);
      box-shadow: var(--shadow-sm);
    }
    .status-icon {
      width: 42px; height: 42px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .status-icon.green  { background: var(--green-bg);  color: var(--green); }
    .status-icon.red    { background: var(--red-light); color: var(--red); }
    .status-icon.grey   { background: #f3f4f6;          color: var(--muted); }
    .status-icon.blue   { background: #eff6ff;          color: #2563eb; }
    .status-label { font-weight: 600; font-size: .875rem; margin-bottom: .15rem; }
    .status-value { font-size: .8rem; color: var(--muted); }

    /* ── Pulse-Dot ── */
    .pulse-wrap { position: relative; width: 10px; height: 10px; }
    .pulse-dot {
      width: 10px; height: 10px; border-radius: 50%; position: absolute;
    }
    .pulse-dot.green { background: var(--green); }
    .pulse-dot.red   { background: var(--red); }
    .pulse-dot.grey  { background: #9ca3af; }
    .pulse-ring {
      width: 18px; height: 18px; border-radius: 50%;
      position: absolute; top: -4px; left: -4px;
      animation: pulse-ring 2s ease-out infinite;
    }
    .pulse-ring.green { border: 2px solid var(--green); }
    @keyframes pulse-ring {
      0%   { transform: scale(.6); opacity: .8; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* ── Alarm-Karte ── */
    .alarm-banner {
      border-radius: var(--radius);
      border: 1.5px solid #fca5a5;
      background: linear-gradient(135deg, #fff5f5 0%, #fff 100%);
      box-shadow: 0 2px 10px rgba(192,57,43,.1);
    }
    .alarm-badge {
      display: inline-flex; align-items: center; gap: .3rem;
      background: var(--red); color: #fff;
      font-size: .7rem; font-weight: 700; letter-spacing: .04em;
      padding: .2rem .55rem; border-radius: 20px; text-transform: uppercase;
    }
    .alarm-title { font-size: 1.1rem; font-weight: 700; margin: .4rem 0 .2rem; }
    .alarm-meta  { font-size: .8rem; color: var(--muted); }

    /* ── Checkboxen ── */
    .device-check {
      display: flex; align-items: center; gap: .6rem;
      padding: .6rem .8rem; border-radius: 8px;
      border: 1px solid var(--border); margin-bottom: .4rem;
      cursor: pointer; transition: border-color .15s, background .15s;
    }
    .device-check:hover { border-color: #fca5a5; background: #fff9f9; }
    .device-check.checked { border-color: var(--red); background: var(--red-light); }
    .device-check input { accent-color: var(--red); width: 15px; height: 15px; flex-shrink: 0; }
    .device-name { font-weight: 600; font-size: .875rem; }
    .device-meta { font-size: .75rem; color: var(--muted); }

    /* ── Buttons ── */
    .btn-on  { background: var(--green); color: #fff; border: none; font-weight: 600; }
    .btn-on:hover  { background: #15803d; color: #fff; }
    .btn-off { background: var(--red);   color: #fff; border: none; font-weight: 600; }
    .btn-off:hover { background: var(--red-dark); color: #fff; }

    /* ── Tabelle ── */
    .history-table td { padding: .55rem .75rem; vertical-align: middle; }
    .history-table tr:last-child td { border-bottom: none; }

    /* ── Debug ── */
    .debug-pre {
      background: #1e1e2e; color: #cdd6f4;
      border-radius: 8px; padding: 1rem;
      font-size: .78rem; max-height: 280px; overflow: auto;
      border: none;
    }

    /* ── Alerts ── */
    .alert { border-radius: 10px; border: none; font-size: .875rem; }

    /* ── Spacing helper ── */
    .page-content { padding: 1.5rem 0 3rem; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg">
  <div class="container-lg">
    <a class="navbar-brand" href="/">
      <span class="flame">🔥</span> Divera → Smarthome
    </a>
    <div class="navbar-nav ms-auto flex-row align-items-center gap-1">
      <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
      <a class="nav-link {% if request.path == '/devices' %}active{% endif %}" href="/devices">Geräte</a>
      <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="/settings">Einstellungen</a>
      <a class="nav-link nav-logout" href="/logout" title="Abmelden"><i class="bi bi-box-arrow-right"></i></a>
    </div>
  </div>
</nav>

<div class="container-lg page-content">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show mb-3" role="alert">
        {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
