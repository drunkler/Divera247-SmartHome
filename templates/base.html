<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Divera → Shelly Schnittstelle</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f0f2f5; }
    .navbar { background: #c0392b !important; }
    .navbar-brand, .nav-link { color: #fff !important; }
    .nav-link:hover { color: #ffd !important; }
    .nav-link.active { font-weight: 600; border-bottom: 2px solid #fff; }
    .card { border: none; box-shadow: 0 1px 6px rgba(0,0,0,.1); }
    .badge-alarm { background: #c0392b; }
    .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .dot-green { background: #27ae60; }
    .dot-red { background: #c0392b; }
    .dot-grey { background: #aaa; }
    .alarm-card { border-left: 4px solid #c0392b; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand fw-bold" href="/"><i class="bi bi-fire"></i> Divera → Shelly</a>
    <div class="navbar-nav ms-auto flex-row gap-3 align-items-center">
      <a class="nav-link {% if request.path == '/' %}active{% endif %}" href="/">Dashboard</a>
      <a class="nav-link {% if request.path == '/devices' %}active{% endif %}" href="/devices">Geräte</a>
      <a class="nav-link {% if request.path == '/settings' %}active{% endif %}" href="/settings">Einstellungen</a>
      <a class="nav-link" href="/logout" title="Abmelden"><i class="bi bi-box-arrow-right"></i></a>
    </div>
  </div>
</nav>
<div class="container pb-5">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
        {{ msg }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
